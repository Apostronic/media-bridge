<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contacto Comercial Mowi</title>
<style>
  :root{
    --ink:#1d1e21;
    --surface:#242631;
    --raised:#2b374d;
    --line:#485267;
    --paper:#ffffff;
    --ink-soft:rgba(255,255,255,.72);
    --ink-faint:rgba(255,255,255,.46);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:"Plus Jakarta Sans",-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    min-height:100vh;
    min-height:100dvh;
    overflow-x:hidden;
  }
  .stage{
    position:relative;
    width:100%;
    min-height:100vh;
    min-height:100dvh;
    overflow:hidden;
    background:var(--ink);
    display:flex;
    flex-direction:column;
  }
  .world-bg{position:absolute;inset:0;overflow:hidden;opacity:.16;pointer-events:none;}
  .world-track{position:absolute;top:50%;left:0;transform:translateY(-50%);display:flex;height:60%;animation:worldpan 55s linear infinite;}
  .world-track img{height:100%;width:auto;flex:none;display:block;}
  @keyframes worldpan{from{transform:translateY(-50%) translateX(0);}to{transform:translateY(-50%) translateX(-50%);}}
  @media (prefers-reduced-motion:reduce){.world-track{animation:none;}}

  .glow{position:absolute;top:-18%;left:50%;width:130%;height:55%;transform:translateX(-50%);background:radial-gradient(closest-side, rgba(72,82,103,.55), rgba(72,82,103,0) 72%);pointer-events:none;}

  .sheet{position:relative;z-index:1;display:flex;flex-direction:column;flex:1;padding:clamp(16px,5vw,26px) clamp(18px,6vw,28px) clamp(16px,5vw,26px);}
  #content{display:flex;flex-direction:column;}

  .brand{display:flex;align-items:center;justify-content:center;padding:2px 0 clamp(8px,2vh,14px);}
  .brand img{height:clamp(18px,4.6vw,22px);width:auto;display:block;}

  .identity{position:relative;text-align:center;padding:0 4px clamp(10px,2.4vh,16px);}
  .identity .eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--paper);text-shadow:0 1px 8px rgba(0,0,0,.65);margin-bottom:6px;}
  .identity .headline{font-size:clamp(18px,5.2vw,22px);font-weight:800;line-height:1.22;text-shadow:0 2px 12px rgba(0,0,0,.6), 0 0 20px rgba(0,0,0,.4);text-wrap:balance;}

  .person{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:2px;}
  .avatar-wrap{position:relative;width:104px;height:104px;margin-bottom:12px;}
  .avatar-ring{position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 200deg, var(--raised), transparent 55%, var(--raised));opacity:.9;}
  .avatar{position:relative;width:104px;height:104px;border-radius:50%;overflow:hidden;border:4px solid var(--ink);background:var(--raised);display:flex;align-items:center;justify-content:center;}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block;}

  .name{font-size:clamp(21px,5.6vw,25px);font-weight:800;letter-spacing:-.01em;line-height:1.15;text-wrap:balance;}
  .badge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--paper);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:3px 11px;margin-top:8px;text-transform:uppercase;}
  .role{font-size:13.5px;font-weight:500;color:var(--paper);margin-top:5px;}
  .place{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--paper);letter-spacing:.02em;text-transform:uppercase;margin-top:8px;}
  .place svg{width:16px;height:12px;border-radius:2px;flex:none;}

  .links{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(6px,2vw,12px);padding:clamp(14px,3.4vh,22px) 2px 2px;}
  .link{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--paper);}
  .link .dot{width:clamp(38px,10vw,48px);height:clamp(38px,10vw,48px);border-radius:50%;background:var(--raised);display:flex;align-items:center;justify-content:center;transition:transform .15s ease, background .15s ease;}
  .link:hover .dot{background:var(--line);transform:translateY(-2px);}
  .link svg{width:40%;height:40%;fill:var(--paper);}
  .link span{font-size:10px;font-weight:600;letter-spacing:.01em;text-align:center;}

  .spacer{flex:1;min-height:6px;}
  .edge-spacer{flex:1;min-height:6px;}
  .cta{display:flex;flex-direction:column;align-items:center;gap:9px;margin-top:0;padding:4px 0 2px;}
  .vehicle-band{display:flex;justify-content:center;align-items:flex-end;padding:clamp(6px,1.6vh,12px) 0 0;}
  .vehicle-band img{width:min(66%,260px);height:auto;display:block;filter:drop-shadow(0 14px 18px rgba(0,0,0,.55));}
  .cta .tap{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--paper);}
  .whatsapp-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:10px 16px;border-radius:13px;background:var(--paper);color:var(--ink);font-weight:700;font-size:12.5px;text-decoration:none;box-shadow:0 10px 24px -8px rgba(0,0,0,.5);}
  .whatsapp-btn svg{width:17px;height:17px;fill:var(--ink);}

  .tagline{text-align:center;font-size:11.5px;font-weight:500;font-style:italic;color:var(--paper);margin-top:13px;line-height:1.4;}

  .directory{padding:12px 2px 2px;}
  .directory h1{font-size:17px;font-weight:800;margin:0 0 4px;text-align:center;}
  .directory p.sub{font-size:12px;color:var(--ink-faint);margin:0 0 14px;text-align:center;}
  .roster{display:flex;flex-direction:column;gap:7px;overflow:auto;max-height:min(48vh,320px);padding-right:2px;}
  .roster a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:12px;background:var(--surface);color:var(--paper);text-decoration:none;}
  .roster a:hover{background:var(--raised);}
  .roster img{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;background:var(--raised);}
  .roster .who{display:flex;flex-direction:column;min-width:0;}
  .roster .who b{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .roster .who small{font-size:11px;color:var(--ink-faint);}

  [hidden]{display:none!important;}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">

  br:'<svg viewBox="0 0 20 14"><rect width="20" height="14" fill="#009739"/><polygon points="10,2 18,7 10,12 2,7" fill="#fedd00"/><circle cx="10" cy="7" r="3" fill="#012169"/></svg>',
  pe:'<svg viewBox="0 0 20 14"><rect width="6.67" height="14" fill="#d91023"/><rect x="6.67" width="6.66" height="14" fill="#fff"/><rect x="13.33" width="6.67" height="14" fill="#d91023"/></svg>',
  cl:'<svg viewBox="0 0 20 14"><rect width="20" height="14" fill="#fff"/><rect y="7" width="20" height="7" fill="#d52b1e"/><rect width="8" height="7" fill="#0039a6"/><polygon points="4,2 4.9,4.2 7.2,4.2 5.4,5.6 6,7.8 4,6.4 2,7.8 2.6,5.6 0.8,4.2 3.1,4.2" fill="#fff"/></svg>'
};

function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function linkRow(items){
  return '<div class="links">' + items.map(function(it){
    return '<a class="link" href="'+it.href+'" target="_blank" rel="noopener"><span class="dot">'+ICONS[it.icon]+'</span><span>'+it.label+'</span></a>';
  }).join("") + '</div>';
}

function placeTag(p){
  return '<div class="place">'+FLAGS[p.bandera]+'<span>'+esc(p.pais)+'</span></div>';
}

function identityHtml(t){
  return '<div class="identity"><div class="eyebrow">'+esc(t.heroEyebrow)+'</div><div class="headline">'+esc(t.heroLine)+'</div></div>';
}

function renderPerson(p){
  const t = TXT[p.idioma] || TXT.es;
  const waHref = "https://wa.me/"+p.tel+"?text="+encodeURIComponent(t.msg(p.nombre));
  document.title = p.nombre + " . Mowi";

  const badgeHtml = p.badge ? '<div class="badge">'+esc(p.badge)+'</div>' : '';
  const placeHtml = p.pais ? placeTag(p) : '';

  const top = identityHtml(t) + '<div class="person">'
    + '<div class="avatar-wrap"><div class="avatar-ring"></div><div class="avatar"><img src="'+esc(p.foto)+'" alt="'+esc(p.nombre)+'"></div></div>'
    + '<div class="name">'+esc(p.nombre)+'</div>'+badgeHtml+'<div class="role">'+esc(p.cargo)+'</div>'+placeHtml
    + '</div>';

  const linksHtml = linkRow([
    {icon:"instagram", href:IG, label:"Instagram"},
    {icon:"facebook", href:FB, label:"Facebook"},
    {icon:"email", href:"mailto:"+p.correo, label:t.mail},
    {icon:"linkedin", href:LI, label:"LinkedIn"},
    {icon:"globe", href:SITE, label:"mowiapp.com"}
  ]);

  const ctaHtml = '<div class="cta"><div class="tap">'+t.tap+'</div>'
    + '<a class="whatsapp-btn" href="'+waHref+'" target="_blank" rel="noopener">'+ICONS.whatsapp+'<span>'+t.wa+'</span></a>'
    + '</div>';

  document.getElementById("content").innerHTML = top + linksHtml + ctaHtml + '<div class="tagline">'+t.slogan+'</div>';
}

function renderDirectory(){
  document.title = "Contacto Comercial Mowi";
  const rows = PEOPLE.map(function(p){
    return '<a href="?p='+p.slug+'"><img src="'+esc(p.foto)+'" alt=""><div class="who"><b>'+esc(p.nombre)+'</b><small>'+esc(p.cargo)+' . '+esc(p.pais)+'</small></div></a>';
  }).join("");
  document.getElementById("content").innerHTML =
    '<div class="directory"><h1>Equipo comercial</h1><p class="sub">Elige un contacto para ver su tarjeta.</p>' +
    '<div class="roster">'+rows+'</div></div>';
}

(function init(){
  const params = new URLSearchParams(location.search);
  const slug = params.get("p");
  const person = PEOPLE.find(function(p){ return p.slug === slug; });
  if (person) renderPerson(person); else renderDirectory();
})();
</script>
